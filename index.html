<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRO LEAGUE SOCCER: MY CAREER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071007;color:#fff;font-family:Arial,sans-serif}
button{font:inherit}
#game{width:100vw;height:100vh;position:relative;overflow:hidden;background:
radial-gradient(circle at 50% 20%,#17351d 0,#071007 55%,#030503 100%)}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}
#home{align-items:center;justify-content:center;flex-direction:column}
.logo{font-size:clamp(28px,6vw,62px);font-weight:900;letter-spacing:2px;text-align:center}
.sub{opacity:.7;margin:8px 0 28px}
.menu{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{border:2px solid #cda52c;background:#102416;color:#fff;padding:14px 24px;border-radius:12px;font-weight:800;cursor:pointer}
.btn.primary{background:#176b35}
.btn:active{transform:scale(.97)}

#styleScreen{padding:5vh 5vw;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center}
h2{margin:0}
.styles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:24px;max-height:70vh}
.style{background:#101a12;border:2px solid #26372a;border-radius:14px;padding:12px;text-align:center;cursor:pointer}
.style.selected{border-color:#e1b735;box-shadow:0 0 0 2px #e1b73555}
.head{width:90px;height:90px;border-radius:50%;margin:5px auto 10px;object-fit:cover;background:#222}
.badge{font-size:12px;opacity:.7}

#career{align-items:center;justify-content:center;flex-direction:column;text-align:center}
.playerCard{display:flex;align-items:center;gap:28px;background:#101a12cc;border:2px solid #cda52c;border-radius:18px;padding:22px 34px}
.playerCard .avatar{width:150px;height:150px;border-radius:12px;object-fit:cover;background:#222}
.info h1{margin:0 0 8px}
.info p{margin:4px 0;opacity:.8}

#transfer{background:#000;align-items:center;justify-content:center}
#transferVideo{width:100%;height:100%;object-fit:contain;background:#000}
.transferUI{position:absolute;left:4%;right:4%;bottom:5%;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.dialog{max-width:65%;background:#071007ee;border:2px solid #cda52c;border-radius:14px;padding:14px 18px}
.dialog strong{color:#e7c14b}
.transferBtns{display:flex;gap:10px;pointer-events:auto}
.skip{background:#111b12dd;border:1px solid #fff6;color:#fff;padding:10px 16px;border-radius:10px}
#transferFallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8vw;
background:radial-gradient(circle at 50% 35%,#18391e 0,#071007 55%,#020302 100%);z-index:1}
#transferFallback .pixelPresident,#transferFallback .transferPlayer{font-size:clamp(90px,15vw,180px);image-rendering:pixelated;filter:drop-shadow(0 12px 5px #000)}
#transferFallback .transferTitle{position:absolute;top:12%;font-size:clamp(30px,6vw,70px);font-weight:900;color:#e2bb45;letter-spacing:4px;text-shadow:4px 4px #000}
#transferVideo{position:relative;z-index:2}
.transferUI{z-index:4}


#match{align-items:center;justify-content:center;flex-direction:column;background:#0b2a13}
.pitch{width:min(90vw,900px);height:min(58vh,520px);border:3px solid #fff;position:relative;background:
repeating-linear-gradient(90deg,#187b35 0,#187b35 10%,#197f38 10%,#197f38 20%)}
.center{position:absolute;left:50%;top:50%;width:120px;height:120px;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}
.ball{position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:move 2.4s infinite alternate ease-in-out}
@keyframes move{to{left:75%;top:30%}}
.score{font-size:28px;font-weight:900;margin-bottom:12px}
.note{margin-top:14px;opacity:.8}

@media(max-width:800px){
 .styles{grid-template-columns:repeat(3,1fr);overflow:auto}
 .playerCard{padding:14px 20px}
 .playerCard .avatar{width:110px;height:110px}
}
@media(orientation:portrait){
 #game:before{content:"Telefonu yatay çevir ↔";position:absolute;z-index:99;inset:0;background:#050805;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;text-align:center}
}
</style>
</head>
<body>
<div id="game">

<section id="home" class="screen active">
  <div class="logo">PRO LEAGUE SOCCER</div>
  <div class="sub">MY CAREER • 2026</div>
  <div class="menu">
    <button class="btn primary" onclick="show('styleScreen')">KARİYERE BAŞLA</button>
  </div>
</section>

<section id="styleScreen" class="screen">
  <div class="topbar">
    <h2>OYUNCU STİLİNİ SEÇ</h2>
    <button class="btn" onclick="show('home')">GERİ</button>
  </div>
  <div class="styles" id="styles"></div>
  <div class="menu">
    <button class="btn primary" onclick="startCareer()">DEVAM ET</button>
  </div>
</section>

<section id="career" class="screen">
  <div class="playerCard">
    <img id="careerAvatar" class="avatar" src="" alt="">
    <div class="info">
      <h1>TİMSAHSARAY</h1>
      <p>Yeni oyuncu sözleşmesi hazır.</p>
      <p id="chosenText"></p>
      <button class="btn primary" onclick="playTransfer()">TRANSFER SAHNESİ</button>
    </div>
  </div>
</section>

<section id="transfer" class="screen">
  <video id="transferVideo" playsinline preload="metadata">
    <source src="transfer_sahnesi.mp4" type="video/mp4">
  </video>
  <div id="transferFallback">
    <div class="pixelPresident">🕴️</div>
    <div class="transferTitle">TİMSAHSARAY</div>
    <div class="transferPlayer">⚽</div>
  </div>
  <div class="transferUI">
    <div class="dialog">
      <strong>KULÜP BAŞKANI</strong><br>
      Timsahsaray'a hoş geldin. Şimdi yeni kariyerin başlıyor!
    </div>
    <div class="transferBtns">
      <button class="skip" onclick="finishTransfer()">DEVAM ET →</button>
    </div>
  </div>
</section>

<section id="match" class="screen">
  <div class="score">TİMSAHSARAY <span id="score">0 - 0</span> RAKİP</div>
  <div class="pitch"><div class="center"></div><div class="ball"></div></div>
  <div class="note">Maç simülasyonu başladı • WORLD SOCCER CHAMPS tarzı</div>
  <div class="menu"><button class="btn" onclick="show('home')">ANA MENÜ</button></div>
</section>

</div>

<script>
const styles=[
 {name:"STİL 1",img:"style1.png"},
 {name:"STİL 2",img:"style2.png"},
 {name:"STİL 3",img:"style3.png"},
 {name:"STİL 4",img:"style4.png"},
 {name:"STİL 5",img:"style5.png"}
];
let selected=0;

function show(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function renderStyles(){
 const box=document.getElementById('styles');
 styles.forEach((s,i)=>{
   const d=document.createElement('div');
   d.className='style'+(i===0?' selected':'');
   d.innerHTML=`<img class="head" src="${s.img}" onerror="this.style.opacity=.15"><div>${s.name}</div><div class="badge">Seçmek için dokun</div>`;
   d.onclick=()=>{
     selected=i;
     document.querySelectorAll('.style').forEach(x=>x.classList.remove('selected'));
     d.classList.add('selected');
   };
   box.appendChild(d);
 });
}
function startCareer(){
 document.getElementById('careerAvatar').src=styles[selected].img;
 document.getElementById('chosenText').textContent=styles[selected].name+" seçildi.";
 show('career');
}
function playTransfer(){
 const v=document.getElementById('transferVideo');
 const fallback=document.getElementById('transferFallback');
 show('transfer');
 fallback.style.display='flex';
 v.style.display='none';
 v.currentTime=0;
 v.onended=finishTransfer;
 v.onerror=()=>{v.style.display='none'; fallback.style.display='flex';};
 v.onloadeddata=()=>{
   fallback.style.display='none';
   v.style.display='block';
   v.play().catch(()=>{});
 };
 // If the browser cannot load the MP4, the pixel fallback stays visible.
 setTimeout(()=>{
   if(v.readyState>=2){
     fallback.style.display='none';
     v.style.display='block';
     v.play().catch(()=>{});
   }
 },800);
}
function finishTransfer(){
 const v=document.getElementById('transferVideo');
 v.pause();
 show('match');
}
renderStyles();
</script>
</body>
</html>
