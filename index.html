<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PRO LEAGUE SOCCER: MY CAREER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101218;color:#fff;font-family:Arial,sans-serif}
.screen{min-height:100vh;display:none;padding:22px;align-items:center;justify-content:center}
.active{display:flex}.card{width:min(900px,100%);background:#191c25;border:1px solid #343846;border-radius:22px;padding:24px;box-shadow:0 15px 50px #0008}
h1{font-size:clamp(28px,7vw,54px);margin:0 0 8px;text-align:center}h2{text-align:center}
.gold{color:#e5b94d}.sub{text-align:center;color:#aeb3c0;margin-bottom:25px}
button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:13px;background:#e5b94d;color:#111;font-weight:800;font-size:17px}
button.secondary{background:#303541;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select{width:100%;padding:14px;border-radius:11px;border:1px solid #454b5b;background:#101218;color:white;font-size:16px}
.label{display:block;color:#b9bec9;margin:10px 0 6px}.hair{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.hair button{padding:10px;background:#303541;color:white;margin:0}.hair button.selected{outline:3px solid #e5b94d}
.story{font-size:18px;line-height:1.6;background:#11141b;padding:20px;border-radius:15px;margin:18px 0}
.actions{display:flex;gap:10px}.actions button{flex:1}
.club{display:flex;align-items:center;gap:18px;padding:18px;border:2px solid #3c424f;border-radius:18px;margin:18px 0}.logo{width:90px;height:90px;object-fit:contain;border-radius:12px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#242834;padding:14px;border-radius:12px;text-align:center}
@media(max-width:550px){.row,.stats{grid-template-columns:1fr}.hair{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<section id="menu" class="screen active"><div class="card">
<h1>PRO LEAGUE SOCCER</h1><h2 class="gold">MY CAREER</h2>
<p class="sub">Kendi futbol kariyerini yaz.</p>
<button onclick="show('story')">OYNA</button>
</div></section>

<section id="story" class="screen"><div class="card">
<h2>HİKÂYENİN BAŞLANGICI</h2>
<div class="story" id="storyText"></div>
<button onclick="nextStory()">DEVAM ET</button>
</div></section>

<section id="create" class="screen"><div class="card">
<h2>OYUNCU OLUŞTUR</h2>
<div class="row">
<div><label class="label">İsim</label><input id="first" placeholder="İsim"></div>
<div><label class="label">Soyisim</label><input id="last" placeholder="Soyisim"></div>
</div>
<label class="label">Mevki</label><input value="FORVET" disabled>
<label class="label">Yaş</label><input value="18" disabled>
<label class="label">Saç stili</label>
<div class="hair" id="hair"></div>
<button onclick="createPlayer()">KARİYERE BAŞLA</button>
</div></section>

<section id="club" class="screen"><div class="card">
<h2>İLK KULÜP TEKLİFİ</h2>
<div class="club">
<img class="logo" src="timsah.jpg" onerror="this.style.display='none'">
<div><h2 style="text-align:left;margin:0">🐊 TİMSAH SARAY</h2><p>Genç forvet sözleşmesi</p></div>
</div>
<button onclick="joinClub()">TİMSAH SARAY'A KATIL</button>
</div></section>

<section id="career" class="screen"><div class="card">
<h2 id="playerName"></h2>
<p class="sub">🐊 TİMSAH SARAY • FORVET • 18 YAŞ</p>
<div class="stats"><div class="stat">REYTİNG<br><b id="rating">65</b></div><div class="stat">GOL<br><b id="goals">0</b></div><div class="stat">ASİST<br><b id="assists">0</b></div></div>
<div class="story"><b>MAÇ GÜNÜ</b><br>İlk profesyonel maçın seni bekliyor. Şimdilik maçları simüle ediyoruz.</div>
<button onclick="simulate()">MAÇI SİMÜLE ET</button>
<button class="secondary" onclick="show('menu')">ANA MENÜ</button>
<p id="result" class="sub"></p>
</div></section>

<script>
let s=0, story=[
"Çocukluğunda ailen maddi açıdan zor günler geçiriyordu. Küçük evinizdeki en büyük hayalin futbolcu olmaktı. Her şeye rağmen topunu elinden bırakmadın.",
"Bir gün babanla konuştun. Baban futbolcu olmanı istemediğini, bu yolun çok zor olduğunu söyledi. Ama sen kararını vermiştin: Futbolcu olacaktın.",
"Yıllar geçti. 18 yaşına geldin. Artık hayalinin peşinden gitmek için futbol seçmelerine katılmaya hazırsın."
];
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function nextStory(){if(s<story.length){storyText.textContent=story[s++]}else show('create')}
storyText.textContent=story[0];s=1;
for(let i=1;i<=12;i++){let b=document.createElement('button');b.textContent='Saç '+i;b.onclick=()=>{document.querySelectorAll('.hair button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};hair.appendChild(b)}
function createPlayer(){let a=first.value.trim(),b=last.value.trim();if(!a||!b){alert('Lütfen isim ve soyisim gir.');return}playerName.textContent=a+' '+b;show('club')}
function joinClub(){show('career')}
function simulate(){let r=Math.random();let g=r>.55?1:0, a=r>.72?1:0;goals.textContent=+goals.textContent+g;assists.textContent=+assists.textContent+a;rating.textContent=+rating.textContent+(g?2:1);result.textContent=g?'⚽ GOL! Takımın kazandı!':'Maç sona erdi. Performansın gelişiyor!'}
</script>
</body></html>
